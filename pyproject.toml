[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spotty-cli"
version = "0.0.3"
description = "Synchronized lyrics in your terminal for the currently playing Spotify track"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["spotify", "lyrics", "cli", "terminal", "music", "karaoke"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Terminals",
]
dependencies = [
    "requests>=2.31.0",
    "rich>=13.7.0",
    "click>=8.1.0",
]

[project.urls]
Homepage = "https://github.com/Arideno/spotty"
Issues = "https://github.com/Arideno/spotty/issues"

[project.scripts]
spotty = "spotty.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.sdist]
exclude = ["CLAUDE.md", ".claude", ".omc", ".pytest_cache", "tests", "dist"]

[tool.hatch.build.targets.wheel]
packages = ["src/spotty"]

[tool.pytest.ini_options]
testpaths = ["tests"]
